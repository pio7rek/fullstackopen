<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link href="styles/style.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orienta&display=swap" rel="stylesheet">
    <title>My test page</title>
  </head>
  <body>
    <h1>My test page</h1>
    <img src="images/firefox-icon.png" alt="The Firefox logo: a flaming fox surrounding the Earth." />
    <p>This is a single paragraph</p>

    <form action="/my-handling-form-page" method="post">
      <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="user_name" value="Type your Name and Surname here" />
      </p>
      <p>
        <label for="mail">Email:</label>
        <input type="email" id="mail" name="user_email" />
      </p>
      <p>
        <label for="msg">Message:</label>
        <textarea id="msg" name="user_message">Wiadomość</textarea>
      </p>
      <p class="button">
        <button type="submit">Send your message</button>
      </p>
    </form>

    <p>At Mozilla, we're a global community of</p>
    <ul>
      <li>technologists</li>
      <li>thinkers</li>
      <li>builders</li>
    </ul>
    <p>working together…</p>
    <ol>
      <li>technologists</li>
      <li>thinkers</li>
      <li>builders</li>
    </ol>
    <a href="https://www.mozilla.org/en-US/about/manifesto/">Mozilla Manifesto</a>
  </body>
</html>
